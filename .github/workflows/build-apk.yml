name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk LimeReport.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LimeReport-apk
          path: LimeReport.apk
      # Keeps a "latest" release with the newest APK, so it can be downloaded straight to the phone.
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest LimeReport.apk --title "Lime Report (latest)" --notes "Built from ${GITHUB_SHA::7}"
