name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Every release must be signed with the same key, or Android refuses to install it as an update.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lime-release.jks"
            echo "LIME_KEYSTORE=$RUNNER_TEMP/lime-release.jks" >> "$GITHUB_ENV"
            echo "LIME_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          elif [ -f keystore/lime-release.jks ]; then
            echo "LIME_KEYSTORE=$PWD/keystore/lime-release.jks" >> "$GITHUB_ENV"
            echo "LIME_KEYSTORE_PASSWORD=$(cat keystore/password.txt)" >> "$GITHUB_ENV"
          else
            echo "::error::No signing key found. Add KEYSTORE_BASE64 and KEYSTORE_PASSWORD secrets."
            exit 1
          fi
      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk LimeReport.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LimeReport-apk
          path: LimeReport.apk
      # Keeps a "latest" release with the newest APK, so it can be downloaded straight to the phone.
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest LimeReport.apk --title "Lime Report (latest)" --notes "Built from ${GITHUB_SHA::7}"
